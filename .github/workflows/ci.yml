name: Перевірки
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Список модулів для попереднього завантаження актуальний
        run: npm run audit:build
      - name: Модульні тести
        run: npm test
      - name: Браузерні тести
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Сценарії (додавання файлів, групове перетягування, панелі, експорт, збереження)
        run: VC_SKIP="кожна кнопка" npm run test:scenarios
      - name: Колір (GPU проти CPU і сторінка «Колір»)
        run: npm run test:color
      - name: Ножі й перенесення кольору (розріз усіх доріжок, режим «Ніж», копіювання й зіставлення кольору)
        run: npm run test:cut
      - name: Субтитри (шаблони, вигляд, безпечна зона, експорт)
        run: npm run test:captions
      - name: Аудити (доступність, швидкість, стрес)
        run: npm run audit:a11y && npm run audit:keyboard && npm run audit:perf && npm run audit:stress
